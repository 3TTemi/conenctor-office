<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connector Office - Virtual App Debrief</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', monospace;
      overflow: hidden;
      background: #87CEEB;
    }
    
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    canvas {
      display: block;
    }
    
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 14px;
      image-rendering: pixelated;
      border: 3px solid #555;
    }
    
    #instructions h3 {
      color: #7CFC00;
      margin-bottom: 8px;
      font-size: 16px;
    }
    
    #instructions kbd {
      background: #444;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #666;
    }
    
    #prompt {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #FFD700;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 18px;
      border: 3px solid #8B4513;
      display: none;
      text-align: center;
      image-rendering: pixelated;
    }
    
    #debrief-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, #3a2a1a 0%, #2a1a0a 100%);
      color: #fff;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      display: none;
      pointer-events: auto;
      border: 4px solid #8B4513;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      image-rendering: pixelated;
    }
    
    #debrief-panel.show {
      display: block;
    }
    
    #debrief-panel h2 {
      color: #7CFC00;
      margin-bottom: 5px;
      font-size: 24px;
      text-shadow: 2px 2px 0 #000;
    }
    
    #debrief-panel .account {
      color: #AAA;
      font-size: 12px;
      margin-bottom: 15px;
    }
    
    #debrief-panel .since {
      color: #FFD700;
      font-size: 14px;
      margin-bottom: 20px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
    }
    
    #debrief-panel ul {
      list-style: none;
      padding: 0;
    }
    
    #debrief-panel li {
      padding: 10px 15px;
      margin: 8px 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      border-left: 4px solid #7CFC00;
      line-height: 1.5;
    }
    
    #debrief-panel li a {
      color: #87CEEB;
      text-decoration: underline;
    }
    
    #debrief-panel .close-btn {
      margin-top: 20px;
      padding: 10px 30px;
      background: #8B4513;
      color: #fff;
      border: 2px solid #654321;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    
    #debrief-panel .close-btn:hover {
      background: #A0522D;
    }
    
    /* Quick Actions stub */
    #debrief-panel .quick-actions-stub {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 0, 0.1);
      border: 2px dashed #FFD700;
      border-radius: 8px;
      text-align: center;
    }
    
    #debrief-panel .quick-actions-stub h4 {
      color: #FFD700;
      margin-bottom: 8px;
    }
    
    #debrief-panel .quick-actions-stub p {
      color: #AAA;
      font-size: 12px;
      margin-bottom: 10px;
    }
    
    #debrief-panel .quick-actions-stub button {
      padding: 8px 16px;
      background: #444;
      color: #888;
      border: 1px solid #666;
      border-radius: 4px;
      cursor: not-allowed;
      font-family: inherit;
    }
    
    #title-banner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #7CFC00;
      padding: 10px 30px;
      border-radius: 8px;
      font-size: 24px;
      border: 3px solid #8B4513;
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 2px;
    }
    
    #minimap {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 150px;
      height: 150px;
      background: rgba(0, 0, 0, 0.7);
      border: 3px solid #8B4513;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui-overlay">
      <div id="title-banner">🏢 CONNECTOR OFFICE</div>
      
      <div id="instructions">
        <h3>Controls</h3>
        <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> - Move</p>
        <p><kbd>E</kbd> - Talk to character</p>
        <p><kbd>ESC</kbd> - Close dialog</p>
      </div>
      
      <div id="prompt">Press <kbd>E</kbd> to talk</div>
      
      <div id="debrief-panel">
        <h2 id="debrief-title">App Name</h2>
        <div class="account" id="debrief-account"></div>
        <div class="since" id="debrief-since">📅 Past 24 hours</div>
        <ul id="debrief-bullets"></ul>
        
        <div class="quick-actions-stub">
          <h4>⚡ Quick Actions</h4>
          <p>Coming in a future update</p>
          <button disabled>Action Stub (TODO)</button>
        </div>
        
        <button class="close-btn" id="close-debrief">Close [ESC]</button>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
