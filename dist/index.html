<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connector Office - Virtual App Debrief</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{background:#87ceeb;font-family:Courier New,monospace;overflow:hidden}#game-container{width:100vw;height:100vh;position:relative}canvas{display:block}#ui-overlay{pointer-events:none;width:100%;height:100%;position:absolute;top:0;left:0}#instructions{color:#fff;image-rendering:pixelated;background:#000000b3;border:3px solid #555;border-radius:8px;padding:15px 20px;font-size:14px;position:absolute;bottom:20px;left:20px}#instructions h3{color:#7cfc00;margin-bottom:8px;font-size:16px}#instructions kbd{background:#444;border:1px solid #666;border-radius:3px;padding:2px 6px}#prompt{color:gold;text-align:center;image-rendering:pixelated;background:#000000d9;border:3px solid #8b4513;border-radius:8px;padding:12px 24px;font-size:18px;display:none;position:absolute;bottom:100px;left:50%;transform:translate(-50%)}#debrief-panel{color:#fff;pointer-events:auto;width:90%;max-width:600px;max-height:80vh;image-rendering:pixelated;background:linear-gradient(#3a2a1a 0%,#2a1a0a 100%);border:4px solid #8b4513;border-radius:12px;padding:30px;display:none;position:absolute;top:50%;left:50%;overflow-y:auto;transform:translate(-50%,-50%);box-shadow:0 0 30px #00000080}#debrief-panel.show{display:block}#debrief-panel h2{color:#7cfc00;text-shadow:2px 2px #000;margin-bottom:5px;font-size:24px}#debrief-panel .account{color:#aaa;margin-bottom:15px;font-size:12px}#debrief-panel .since{color:gold;background:#0000004d;border-radius:4px;margin-bottom:20px;padding:8px;font-size:14px}#debrief-panel ul{padding:0;list-style:none}#debrief-panel li{background:#ffffff1a;border-left:4px solid #7cfc00;border-radius:6px;margin:8px 0;padding:10px 15px;line-height:1.5}#debrief-panel li a{color:#87ceeb;text-decoration:underline}#debrief-panel .close-btn{color:#fff;cursor:pointer;background:#8b4513;border:2px solid #654321;border-radius:6px;margin-top:20px;margin-left:auto;margin-right:auto;padding:10px 30px;font-family:inherit;font-size:16px;display:block}#debrief-panel .close-btn:hover{background:sienna}#debrief-panel .quick-actions-stub{text-align:center;background:#ffff001a;border:2px dashed gold;border-radius:8px;margin-top:20px;padding:15px}#debrief-panel .quick-actions-stub h4{color:gold;margin-bottom:8px}#debrief-panel .quick-actions-stub p{color:#aaa;margin-bottom:10px;font-size:12px}#debrief-panel .quick-actions-stub button{color:#888;cursor:not-allowed;background:#444;border:1px solid #666;border-radius:4px;padding:8px 16px;font-family:inherit}#title-banner{color:#7cfc00;text-shadow:2px 2px #000;letter-spacing:2px;background:#000000b3;border:3px solid #8b4513;border-radius:8px;padding:10px 30px;font-size:24px;position:absolute;top:20px;left:50%;transform:translate(-50%)}#minimap{background:#000000b3;border:3px solid #8b4513;border-radius:8px;width:150px;height:150px;position:absolute;top:20px;right:20px}</style>
  <script type="module" crossorigin src="/assets/index-CxU1iZS0.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="ui-overlay">
      <div id="title-banner">🏢 CONNECTOR OFFICE</div>
      
      <div id="instructions">
        <h3>Controls</h3>
        <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> - Move</p>
        <p><kbd>E</kbd> - Talk to character</p>
        <p><kbd>ESC</kbd> - Close dialog</p>
      </div>
      
      <div id="prompt">Press <kbd>E</kbd> to talk</div>
      
      <div id="debrief-panel">
        <h2 id="debrief-title">App Name</h2>
        <div class="account" id="debrief-account"></div>
        <div class="since" id="debrief-since">📅 Past 24 hours</div>
        <ul id="debrief-bullets"></ul>
        
        <div class="quick-actions-stub">
          <h4>⚡ Quick Actions</h4>
          <p>Coming in a future update</p>
          <button disabled>Action Stub (TODO)</button>
        </div>
        
        <button class="close-btn" id="close-debrief">Close [ESC]</button>
      </div>
    </div>
  </div>
  
</body>
</html>
